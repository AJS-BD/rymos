name: Apply Supabase Sync SQL

# Applies a SQL file from the repo to the production Supabase database via the
# Management API (POST /v1/projects/{ref}/database/query — the same endpoint the
# dashboard SQL Editor and `supabase db query --linked -f` use).
#
# ONE-TIME SETUP:
#   1. Create an access token: https://supabase.com/dashboard/account/tokens
#      (scope: database write, or full access)
#   2. Add it as the repo secret SUPABASE_ACCESS_TOKEN:
#      Settings → Secrets and variables → Actions → New repository secret
#
# THEN ANY TIME: Actions → "Apply Supabase Sync SQL" → Run workflow.
# The sync SQL is fully idempotent — safe to re-run.

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: "Path to the SQL file to apply"
        required: true
        default: "supabase/sync_20260922_prod_sync.sql"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply SQL to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: imcsesyqurkpvguwpmem
          SQL_FILE: ${{ inputs.sql_file }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set."
            echo "Create a token at https://supabase.com/dashboard/account/tokens"
            echo "then add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          if [ ! -f "$SQL_FILE" ]; then
            echo "::error::SQL file not found: $SQL_FILE"
            exit 1
          fi

          echo "Applying $SQL_FILE to project $SUPABASE_PROJECT_REF ..."

          jq -n --rawfile q "$SQL_FILE" '{query: $q}' > payload.json
          echo "Payload size: $(wc -c < payload.json) bytes"

          STATUS=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json)

          echo "HTTP status: $STATUS"
          echo "--- response (first 3000 chars) ---"
          head -c 3000 response.json || true
          echo
          echo "------------------------------------"

          if [ "$STATUS" != "201" ] && [ "$STATUS" != "200" ]; then
            echo "::error::Supabase rejected the query (HTTP $STATUS). See response above."
            exit 1
          fi

      - name: Verify tables now exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: imcsesyqurkpvguwpmem
        run: |
          set -euo pipefail

          VERIFY='SELECT table_name FROM information_schema.tables WHERE table_schema = '"'"'public'"'"' ORDER BY table_name;'
          jq -n --arg q "$VERIFY" '{query: $q}' > verify-payload.json

          STATUS=$(curl -sS -o verify-response.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @verify-payload.json)

          if [ "$STATUS" != "201" ] && [ "$STATUS" != "200" ]; then
            echo "::warning::Verification query failed (HTTP $STATUS) — but the apply step succeeded."
            exit 0
          fi

          echo "Tables in prod after sync:"
          echo "---------------------------"
          jq -r '.[].table_name' verify-response.json
          echo "---------------------------"

          EXPECTED="settings coupons wishlists credit_applications credit_plans installments order_status_history product_reviews contact_messages admin_users"
          MISSING=""
          for t in $EXPECTED; do
            if ! jq -r '.[].table_name' verify-response.json | grep -qx "$t"; then
              MISSING="$MISSING $t"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::warning::Still missing after apply:$MISSING"
            exit 1
          else
            echo "All expected tables present. Sync verified."
          fi
